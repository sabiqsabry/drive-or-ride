<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f8" />
    <script>
      // Set the theme before first paint to avoid a flash: saved choice, else light.
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#07090f')
      })()
    </script>
    <meta name="description" content="Is it cheaper to drive or take PickMe / Uber? Compare fuel cost against ride-hailing fares for any trip in Sri Lanka." />
    <meta name="author" content="Sabiq Sabry (novusian)" />
    <meta property="og:title" content="Drive or Ride? by Sabiq Sabry" />
    <meta property="og:description" content="Is it cheaper to drive there yourself, or take PickMe / Uber? Fuel, traffic and fares compared." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
    <title>Drive or Ride?</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
